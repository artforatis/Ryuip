<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROFiN Whitelist</title>
<style>
:root{
  --ink:#2b1d17;--cream:#fffaf0;--gold:#f3c969;--coral:#ef8a72;--sea:#2e86b8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#06283f;color:var(--ink);
  font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;-webkit-text-size-adjust:100%}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#loader{position:fixed;inset:0;display:grid;place-items:center;z-index:20;
  background:linear-gradient(180deg,#0d4570,#06283f);transition:opacity .8s ease}
#loader.off{opacity:0;pointer-events:none}
#loader div{text-align:center;color:var(--cream)}
#loader h1{margin:0;font-size:clamp(34px,9vw,64px);letter-spacing:4px;text-shadow:4px 4px 0 var(--ink)}
#bar{width:min(60vw,240px);height:12px;border:3px solid var(--cream);border-radius:9px;margin:18px auto 0;overflow:hidden}
#fill{height:100%;width:0;background:var(--gold);transition:width .4s ease}
#startwrap{position:fixed;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;z-index:6;transition:opacity .5s ease}
.btn{font-family:inherit;font-weight:bold;letter-spacing:1.5px;cursor:pointer;color:var(--ink);
  background:linear-gradient(180deg,#ffdf90,var(--gold));border:3px solid var(--ink);
  border-radius:18px 22px 18px 22px;box-shadow:0 7px 0 var(--ink),0 12px 18px rgba(4,28,48,.45);
  padding:15px 30px;font-size:clamp(15px,4vw,20px);min-height:54px;
  transition:transform .12s ease,box-shadow .12s ease,filter .2s ease}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:linear-gradient(180deg,#fff,var(--cream))}
.btn.small{padding:10px 16px;font-size:14px;border-radius:14px;box-shadow:0 4px 0 var(--ink);min-height:44px}
#panel{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%) translateY(26px);width:min(94vw,420px);z-index:8;opacity:0;
  pointer-events:none;transition:opacity .5s ease,transform .5s ease}
#panel.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.card{background:var(--cream);border:4px solid var(--ink);border-radius:26px 30px 24px 28px;
  padding:18px 16px 14px;box-shadow:0 10px 0 rgba(43,29,23,.4),0 18px 30px rgba(3,24,42,.5);
  animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -7px}}
.card h2{margin:0 0 4px;font-size:clamp(16px,4.4vw,20px);letter-spacing:1px}
.card p{margin:6px 0;font-size:14px;line-height:1.45}
.step{font-size:12px;font-weight:bold;letter-spacing:2px;color:#7a6357;margin:0}
input{width:100%;font-family:inherit;font-size:16px;padding:12px;margin-top:8px;
  border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);min-height:48px}
input:focus{outline:3px solid var(--sea);outline-offset:1px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row .btn{flex:1 1 auto}
.check{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:14px;font-weight:bold;cursor:pointer}
.box{width:26px;height:26px;border:3px solid var(--ink);border-radius:8px;background:#fff;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.box.done{background:var(--gold)}
.box.done::after{content:"";width:9px;height:15px;border:solid var(--ink);border-width:0 4px 4px 0;
  transform:rotate(42deg) translate(-1px,-2px)}
.note{font-size:12px;color:#7a6357;margin-top:10px;line-height:1.4}
.err{font-size:13px;color:#b03a2e;font-weight:bold;margin-top:8px;min-height:18px}
#final{position:fixed;inset:0;display:none;place-items:center;z-index:9;padding:18px;
  background:radial-gradient(circle at 50% 40%,rgba(8,50,82,.3),rgba(4,28,48,.8))}
#final.on{display:grid}
#final .card{text-align:center;max-width:min(94vw,430px)}
#final img{width:min(48vw,190px);display:block;margin:0 auto 6px;animation:cheer 2.6s ease-in-out infinite}
@keyframes cheer{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}
@media (max-height:620px){.card{padding:14px 14px 12px}.card p{margin:4px 0}}
</style>
</head>
<body>
<div id="loader"><div><h1>ROFiN</h1><div id="bar"><div id="fill"></div></div></div></div>
<div id="startwrap"><button class="btn" id="start">JOIN WHITELIST</button></div>
<div id="panel"></div>
<div id="final"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const CONFIG={
  endpoint:"aHR0cHM6Ly9zY3JpcHQuZ29vZ2xlLmNvbS9tYWNyb3Mvcy9BS2Z5Y2J5bXV1Vkp5TDQ3S3FfckxCbGdudk9SWDVFTG1lQnVPXzI0aGxsaHItRmZ0dTQ1RFNkQTliR2R2S09Yak1Td3BhVS9leGVj",
  handle:"ROFiNCrypto",
  profileUrl:"https://x.com/ROFiNCrypto",
  pinnedPostUrl:"https://x.com/ROFiNCrypto"
};
const SHARKS=["assets/characters/rofin-2.png","assets/characters/rofin-6.png","assets/characters/rofin-5.png",
  "assets/characters/rofin-1.png","assets/characters/rofin-4.png","assets/characters/rofin-3.png"];
const SAIL_LOGO="assets/logo/sail-logo.png";

const isMobile=matchMedia("(max-width:820px), (pointer:coarse)").matches;
const Q={seg:isMobile?110:210,size:isMobile?520:760,drops:isMobile?180:420,dpr:isMobile?1.6:2,
  aa:!isMobile,shadow:!isMobile};

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(isMobile?62:52,innerWidth/innerHeight,0.5,1400);
const renderer=new THREE.WebGLRenderer({antialias:Q.aa,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(devicePixelRatio,Q.dpr));
renderer.setSize(innerWidth,innerHeight);
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=Q.shadow;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const SKY_TOP=new THREE.Color(0x2f7fc4),SKY_LOW=new THREE.Color(0xbfe9f7);
const AIR_FOG=new THREE.Color(0xb6e6f8),SEA_FOG=new THREE.Color(0x1274ab);
scene.fog=new THREE.FogExp2(AIR_FOG.getHex(),0.0016);
scene.background=AIR_FOG.clone();

const sun=new THREE.DirectionalLight(0xfff4d6,1.4);
sun.position.set(-70,90,60);
if(Q.shadow){
  sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
  const sc=sun.shadow.camera;sc.left=-60;sc.right=60;sc.top=60;sc.bottom=-60;sc.near=10;sc.far=260;
}
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xe4f8ff,0x2b86b8,1.0));
scene.add(new THREE.AmbientLight(0xffffff,0.32));

function canvasTex(w,h,draw,rep){
  const c=document.createElement("canvas");c.width=w;c.height=h;
  draw(c.getContext("2d"),w,h);
  const tx=new THREE.CanvasTexture(c);
  tx.encoding=THREE.sRGBEncoding;
  if(rep){tx.wrapS=tx.wrapT=THREE.RepeatWrapping;tx.repeat.set(rep[0],rep[1]);}
  tx.anisotropy=4;
  return tx;
}
const woodTex=canvasTex(256,256,(g,w,h)=>{
  g.fillStyle="#b07a45";g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=32){
    g.fillStyle=y%64===0?"#a06d3c":"#bb844c";g.fillRect(0,y,w,30);
    g.strokeStyle="rgba(60,34,18,.65)";g.lineWidth=3;
    g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();
    for(let i=0;i<14;i++){
      g.strokeStyle="rgba(90,55,28,"+(0.08+Math.random()*0.16)+")";g.lineWidth=1+Math.random()*2;
      const yy=y+4+Math.random()*22;
      g.beginPath();g.moveTo(0,yy);
      g.bezierCurveTo(w*0.3,yy+(Math.random()*6-3),w*0.7,yy+(Math.random()*6-3),w,yy);g.stroke();
    }
  }
},[3,2]);
const sailTex=canvasTex(512,512,(g,w,h)=>{
  g.fillStyle="#fbf3e2";g.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){
    g.strokeStyle="rgba(190,170,140,"+(0.05+Math.random()*0.12)+")";g.lineWidth=1+Math.random()*3;
    g.beginPath();g.moveTo(0,Math.random()*h);g.lineTo(w,Math.random()*h);g.stroke();
  }
  g.strokeStyle="rgba(150,128,96,.5)";g.lineWidth=4;
  for(let y=64;y<h;y+=64){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();}
  g.save();g.translate(w/2,h/2);
  g.strokeStyle="#2b1d17";g.lineWidth=14;g.lineCap="round";g.lineJoin="round";g.fillStyle="#8fd3ee";
  g.beginPath();g.arc(0,0,104,0,Math.PI*2);g.fill();g.stroke();
  g.beginPath();g.moveTo(-78,26);g.quadraticCurveTo(-39,-16,0,26);g.quadraticCurveTo(39,68,78,26);g.stroke();
  g.beginPath();g.moveTo(-54,-34);g.quadraticCurveTo(-27,-70,0,-34);g.quadraticCurveTo(27,2,54,-34);g.stroke();
  g.restore();
});
const skinTex=canvasTex(8,8,g=>{g.fillStyle="#f6cfa8";g.fillRect(0,0,8,8)});
const sandTex=canvasTex(256,256,(g,w,h)=>{
  g.fillStyle="#f0dfae";g.fillRect(0,0,w,h);
  for(let i=0;i<2600;i++){
    g.fillStyle="rgba("+(200+Math.random()*50|0)+","+(180+Math.random()*50|0)+","+(130+Math.random()*50|0)+",.5)";
    g.fillRect(Math.random()*w,Math.random()*h,2,2);
  }
  for(let i=0;i<26;i++){
    g.strokeStyle="rgba(196,172,124,.5)";g.lineWidth=2+Math.random()*3;
    const y=Math.random()*h;
    g.beginPath();g.moveTo(0,y);g.bezierCurveTo(w*.3,y+8,w*.6,y-8,w,y);g.stroke();
  }
},[7,7]);
const logoImg=new Image();
logoImg.crossOrigin="anonymous";
logoImg.onload=()=>{
  const ctx=sailTex.image.getContext("2d");
  const W=sailTex.image.width;
  ctx.clearRect(W*0.5-140,W*0.5-140,280,280);
  ctx.fillStyle="#fbf3e2";ctx.fillRect(W*0.5-140,W*0.5-140,280,280);
  ctx.drawImage(logoImg,W*0.5-116,W*0.5-116,232,232);
  sailTex.needsUpdate=true;
};
logoImg.src=SAIL_LOGO;

const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:SKY_TOP},low:{value:SKY_LOW},sunDir:{value:sun.position.clone().normalize()}},
  vertexShader:"varying vec3 vP; void main(){vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
  fragmentShader:"uniform vec3 top; uniform vec3 low; uniform vec3 sunDir; varying vec3 vP;"+
  "void main(){ float h=clamp(vP.y*1.15+0.18,0.0,1.0); vec3 c=mix(low,top,pow(h,0.75));"+
  "float s=pow(max(dot(vP,normalize(sunDir)),0.0),90.0); c+=vec3(1.0,0.93,0.72)*s*0.9;"+
  "float g=pow(max(dot(vP,normalize(sunDir)),0.0),6.0); c+=vec3(1.0,0.9,0.7)*g*0.18;"+
  "gl_FragColor=vec4(c,1.0);}"});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(900,32,20),skyMat));

const cloudTex=canvasTex(256,128,(g,w,h)=>{
  g.clearRect(0,0,w,h);
  const blob=(x,y,r)=>{g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fillStyle="rgba(255,255,255,.95)";g.fill();
    g.lineWidth=5;g.strokeStyle="rgba(43,29,23,.32)";g.stroke();};
  blob(90,80,34);blob(130,64,42);blob(174,82,30);blob(60,86,24);
});
const clouds=new THREE.Group();
for(let i=0;i<14;i++){
  const m=new THREE.Sprite(new THREE.SpriteMaterial({map:cloudTex,transparent:true,depthWrite:false,fog:false}));
  const a=Math.random()*Math.PI*2,r=180+Math.random()*420;
  m.position.set(Math.cos(a)*r,48+Math.random()*70,Math.sin(a)*r);
  const s=40+Math.random()*70;m.scale.set(s*2,s,1);
  m.userData.sp=0.4+Math.random()*0.8;
  clouds.add(m);
}
scene.add(clouds);

const oceanUniforms={
  uTime:{value:0},
  uDeep:{value:new THREE.Color(0x0d5f95)},
  uShallow:{value:new THREE.Color(0x39bcdd)},
  uSky:{value:new THREE.Color(0xd8f3ff)},
  uSunDir:{value:sun.position.clone().normalize()},
  uUnder:{value:0},
  uFogColor:{value:AIR_FOG.clone()},
  uFogDensity:{value:0.0016}
};
const oceanMat=new THREE.ShaderMaterial({
  uniforms:oceanUniforms,side:THREE.DoubleSide,transparent:true,
  vertexShader:[
  "uniform float uTime; varying vec3 vW; varying vec3 vN; varying float vC;",
  "float wh(vec2 p){",
  "  float h=sin(p.x*0.075+uTime*0.85)*0.95;",
  "  h+=sin(p.y*0.104-uTime*1.05)*0.78;",
  "  h+=sin((p.x+p.y)*0.058+uTime*0.62)*1.15;",
  "  h+=sin((p.x*0.42-p.y*0.63)*0.19+uTime*1.55)*0.32;",
  "  h+=sin((p.x*0.9+p.y*0.3)*0.33-uTime*2.1)*0.14;",
  "  return h;}",
  "void main(){",
  "  vec4 wp=modelMatrix*vec4(position,1.0);",
  "  float h=wh(wp.xz); wp.y+=h;",
  "  float e=0.9;",
  "  float hx=wh(wp.xz+vec2(e,0.0)); float hz=wh(wp.xz+vec2(0.0,e));",
  "  vN=normalize(vec3(h-hx,e,h-hz)); vW=wp.xyz; vC=h;",
  "  gl_Position=projectionMatrix*viewMatrix*wp;}"].join("\n"),
  fragmentShader:[
  "uniform vec3 uDeep; uniform vec3 uShallow; uniform vec3 uSky; uniform vec3 uSunDir;",
  "uniform float uUnder; uniform vec3 uFogColor; uniform float uFogDensity;",
  "varying vec3 vW; varying vec3 vN; varying float vC;",
  "void main(){",
  "  vec3 V=normalize(cameraPosition-vW);",
  "  vec3 N=normalize(vN); if(!gl_FrontFacing) N=-N;",
  "  float fres=pow(1.0-max(dot(N,V),0.0),3.0);",
  "  vec3 col=mix(uDeep,uShallow,clamp(vC*0.35+0.5,0.0,1.0));",
  "  col=mix(col,uSky,fres*0.72);",
  "  vec3 R=reflect(-normalize(uSunDir),N);",
  "  col+=vec3(1.0,0.95,0.82)*pow(max(dot(R,V),0.0),110.0)*0.85;",
  "  float foam=smoothstep(1.45,2.2,vC)*0.55;",
  "  col=mix(col,vec3(1.0),foam);",
  "  vec3 under=mix(vec3(0.05,0.35,0.52),vec3(0.75,0.93,1.0),fres*0.8);",
  "  col=mix(col,under,uUnder);",
  "  float d=length(cameraPosition-vW);",
  "  float f=1.0-exp(-uFogDensity*uFogDensity*d*d);",
  "  col=mix(col,uFogColor,clamp(f,0.0,1.0));",
  "  gl_FragColor=vec4(col,0.97);}"].join("\n")});
const ocean=new THREE.Mesh(new THREE.PlaneGeometry(Q.size,Q.size,Q.seg,Q.seg),oceanMat);
ocean.rotation.x=-Math.PI/2;
scene.add(ocean);

function waveHeight(x,z,tt){
  let h=Math.sin(x*0.075+tt*0.85)*0.95;
  h+=Math.sin(z*0.104-tt*1.05)*0.78;
  h+=Math.sin((x+z)*0.058+tt*0.62)*1.15;
  h+=Math.sin((x*0.42-z*0.63)*0.19+tt*1.55)*0.32;
  h+=Math.sin((x*0.9+z*0.3)*0.33-tt*2.1)*0.14;
  return h;
}

const wood=new THREE.MeshStandardMaterial({map:woodTex,roughness:.85,metalness:.02});
const darkWood=new THREE.MeshStandardMaterial({color:0x6d4527,roughness:.9});
const trim=new THREE.MeshStandardMaterial({color:0x3a271a,roughness:.75});
const ropeMat=new THREE.MeshStandardMaterial({color:0xd9c08a,roughness:1});
const outlineMat=new THREE.MeshBasicMaterial({color:0x2b1d17,side:THREE.BackSide});

function addPart(parent,geo,mat,pos,rot,out){
  const m=new THREE.Mesh(geo,mat);
  if(pos)m.position.set(pos[0],pos[1],pos[2]);
  if(rot)m.rotation.set(rot[0],rot[1],rot[2]);
  if(Q.shadow){m.castShadow=true;m.receiveShadow=true;}
  parent.add(m);
  if(out!==false){
    const o=new THREE.Mesh(geo,outlineMat);
    o.position.copy(m.position);o.rotation.copy(m.rotation);
    o.scale.multiplyScalar(typeof out==="number"?out:1.03);
    parent.add(o);
  }
  return m;
}

const ship=new THREE.Group();
const hullShape=new THREE.Shape();
hullShape.moveTo(-11,0);
hullShape.bezierCurveTo(-11.6,2.6,-9.4,4.2,-6,4.6);
hullShape.lineTo(7.4,4.6);
hullShape.bezierCurveTo(10.6,4.4,12.4,2.6,12.2,-0.4);
hullShape.bezierCurveTo(11.2,-3.4,6.2,-5.2,0,-5.2);
hullShape.bezierCurveTo(-6.2,-5.2,-10.4,-3.2,-11,0);
const hullGeo=new THREE.ExtrudeGeometry(hullShape,{depth:7.4,bevelEnabled:true,bevelSize:.5,bevelThickness:.5,bevelSegments:3,curveSegments:24});
hullGeo.rotateX(Math.PI/2);
hullGeo.translate(0,0,3.7);
addPart(ship,hullGeo,wood,[0,0,0],null,1.012);
addPart(ship,new THREE.BoxGeometry(21.5,.5,7.2),darkWood,[0.4,4.5,0]);
addPart(ship,new THREE.BoxGeometry(22.6,1.1,.55),trim,[0.4,3.4,3.6]);
addPart(ship,new THREE.BoxGeometry(22.6,1.1,.55),trim,[0.4,3.4,-3.6]);
for(let i=-9;i<=10;i+=1.9){
  addPart(ship,new THREE.CylinderGeometry(.16,.16,2.2,7),trim,[i,5.6,3.5]);
  addPart(ship,new THREE.CylinderGeometry(.16,.16,2.2,7),trim,[i,5.6,-3.5]);
}
addPart(ship,new THREE.BoxGeometry(21.4,.34,.34),trim,[0.4,6.7,3.5]);
addPart(ship,new THREE.BoxGeometry(21.4,.34,.34),trim,[0.4,6.7,-3.5]);
addPart(ship,new THREE.BoxGeometry(6.4,2.2,6.6),wood,[-7.4,5.9,0]);
addPart(ship,new THREE.BoxGeometry(5.4,1.6,5.6),darkWood,[-7.4,7.3,0]);
const wheel=new THREE.Group();
addPart(wheel,new THREE.TorusGeometry(1.15,.16,8,22),trim,[0,0,0],[0,Math.PI/2,0]);
for(let i=0;i<8;i++)addPart(wheel,new THREE.CylinderGeometry(.09,.09,2.8,6),trim,[0,0,0],[Math.PI/2,0,i*Math.PI/8]);
wheel.position.set(-5.1,8.5,0);
ship.add(wheel);
addPart(ship,new THREE.CylinderGeometry(.2,.2,2.4,8),trim,[-5.1,7.3,0]);
addPart(ship,new THREE.CylinderGeometry(.44,.62,22,12),darkWood,[1.4,15,0]);
addPart(ship,new THREE.CylinderGeometry(.24,.24,11,8),darkWood,[1.4,21.4,0],[Math.PI/2,0,0]);
addPart(ship,new THREE.BoxGeometry(2.6,.6,2.6),trim,[1.4,25.4,0]);
const flag=new THREE.Mesh(new THREE.PlaneGeometry(3.4,2.1,10,6),
  new THREE.MeshStandardMaterial({color:0xef8a72,side:THREE.DoubleSide,roughness:.9}));
flag.position.set(3.2,25.9,0);
ship.add(flag);

const sailUniforms={uTime:{value:0},map:{value:sailTex},uWind:{value:1}};
const sailMat=new THREE.ShaderMaterial({uniforms:sailUniforms,side:THREE.DoubleSide,
  vertexShader:[
  "uniform float uTime; uniform float uWind; varying vec2 vUv; varying float vSh;",
  "void main(){ vUv=uv; vec3 p=position;",
  "  float belly=sin(uv.x*3.14159)*sin(uv.y*3.14159);",
  "  p.z+=belly*(1.6+sin(uTime*0.7)*0.35)*uWind;",
  "  p.z+=sin(uv.y*9.0+uTime*2.4)*0.18*uv.x*uWind;",
  "  p.z+=sin(uv.x*7.0-uTime*1.7)*0.12*uWind;",
  "  vSh=belly;",
  "  gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}"].join("\n"),
  fragmentShader:[
  "uniform sampler2D map; varying vec2 vUv; varying float vSh;",
  "void main(){ vec4 c=texture2D(map,vUv); c.rgb*=0.82+0.26*vSh;",
  "  gl_FragColor=vec4(c.rgb,1.0);}"].join("\n")});
const sail=new THREE.Mesh(new THREE.PlaneGeometry(12.6,13.4,28,28),sailMat);
sail.position.set(1.4,15.6,0);

function palm(x,z,s){
  const g=new THREE.Group();

    new THREE.Vector3(0,0,0),new THREE.Vector3(0.7,4,0.3),
    new THREE.Vector3(1.6,8,0.6),new THREE.Vector3(2.6,11.6,0.9)]);

    const leaf=new THREE.Mesh(new THREE.PlaneGeometry(7.4,1.9,6,1),leafMat);
    const p=leaf.geometry.attributes.position;
    for(let v=0;v<p.count;v++){

      p.setZ(v,-Math.pow(Math.abs(lx)/3.7,2)*1.5);
      p.setY(v,p.getY(v)*(1-Math.abs(lx)/4.6));

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  t+=dt;
  oceanUniforms.uTime.value=t;
  sailUniforms.uTime.value=t;
  sharkUniforms.uTime.value=t;

  shipZ-=shipSpeed*dt;
  ship.position.z=shipZ;
  ocean.position.z=shipZ;
  ship.position.y=waveHeight(ship.position.x,shipZ,t)*0.85-1.2;
  ship.rotation.z=Math.sin(t*0.62)*0.035+Math.sin(t*0.31)*0.02;
  ship.rotation.x=Math.sin(t*0.48+1.4)*0.028;
  ship.rotation.y=Math.sin(t*0.22)*0.012;
  wheel.rotation.x=Math.sin(t*0.5)*0.25;
  flag.rotation.y=Math.sin(t*2.2)*0.25;
  flag.position.x=3.2+Math.sin(t*2.2)*0.2;
  sailUniforms.uWind.value=0.7+Math.min(shipSpeed/10,1)*0.6+Math.sin(t*0.5)*0.12;

  for(let i=0;i<clouds.children.length;i++){
    const c=clouds.children[i];
    c.position.x+=c.userData.sp*dt*1.2;
    if(c.position.x>520)c.position.x=-520;
  }

  if(shipSpeed>0.4){
    for(let i=0;i<3;i++){
      const idx=Math.floor(Math.random()*wakeCount);
      wPos[idx*3]=ship.position.x+(Math.random()-.5)*9;
      wPos[idx*3+1]=0.6;
      wPos[idx*3+2]=shipZ+11+Math.random()*3;
      wLife[idx]=1;
    }
  }
  for(let i=0;i<wakeCount;i++){
    if(wLife[i]>0){
      wLife[i]-=dt*0.35;
      wPos[i*3+2]+=dt*3.5;
      if(wLife[i]<=0)wPos[i*3+1]=-99;
    }
  }
  wake.geometry.attributes.position.needsUpdate=true;
  wake.material.opacity=0.2+Math.min(shipSpeed/8,1)*0.6;

  under+=(underT-under)*Math.min(1,dt*1.6);
  oceanUniforms.uUnder.value=under;
  const fogC=AIR_FOG.clone().lerp(SEA_FOG,under);
  scene.fog.color.copy(fogC);
  scene.fog.density=0.0016+under*0.0082;
  scene.background=fogC;
  oceanUniforms.uFogColor.value.copy(fogC);
  oceanUniforms.uFogDensity.value=scene.fog.density;
  sharkUniforms.uAmt.value=under;
  rays.position.z=shipZ;kelp.position.z=shipZ;seabed.position.z=shipZ;
  particles.visible=under>0.05;
  rays.visible=under>0.05;
  kelp.visible=under>0.15;
  seabed.visible=under>0.15;
  if(particles.visible){
    for(let i=0;i<Q.drops;i++){
      pPos[i*3+1]+=pSpd[i]*dt*1.2;
      if(pPos[i*3+1]>2){
        pPos[i*3+1]=-70;
        pPos[i*3]=ship.position.x+(Math.random()-.5)*90;
        pPos[i*3+2]=shipZ+(Math.random()-.5)*90;
      }
    }
    particles.geometry.attributes.position.needsUpdate=true;
    for(let i=0;i<rays.children.length;i++){
      const r=rays.children[i];
      r.rotation.z=Math.sin(t*0.3+r.userData.ph)*0.14;
    }
    for(let i=0;i<kelp.children.length;i++){
      const k=kelp.children[i];
      k.rotation.z=Math.sin(t*0.8+k.userData.ph)*0.16;
    }
  }

  if(Math.abs(rodTension-lastTension)>0.004){buildRod();lastTension=rodTension;}
  const tip=rodCurve.getPoint(1).clone();
  rodGroup.localToWorld(tip);
  lineLen+=(lineTarget-lineLen)*Math.min(1,dt*2.1);
  hookOutCur+=(hookOut-hookOutCur)*Math.min(1,dt*2.4);
  hookPos.set(tip.x+1.4+hookOutCur*0.22,tip.y-lineLen,tip.z+0.8-hookOutCur);
  hook.position.copy(hookPos);
  hook.rotation.z=Math.sin(t*1.5)*0.15;
  for(let i=0;i<LINE_PTS;i++){
    const k=i/(LINE_PTS-1);
    const sag=(1-rodTension)*Math.sin(k*Math.PI)*(1.1+Math.min(lineLen*0.05,1.6));
    linePts[i].set(
      tip.x+(hookPos.x-tip.x)*k+Math.sin(t*1.1+k*4)*0.09*(1-rodTension),
      tip.y+(hookPos.y-tip.y)*k-sag,
      tip.z+(hookPos.z-tip.z)*k+Math.cos(t*0.9+k*3)*0.07*(1-rodTension));
  }
  fishLine.geometry.dispose();
  fishLine.geometry=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(linePts),18,0.115,5,false);
  if(lastHookY>0.2&&hookPos.y<=0.2){
    splash.position.set(hookPos.x,0.18,hookPos.z);
    splash.visible=true;splash.scale.setScalar(0.5);splashT=1;
  }
  lastHookY=hookPos.y;
  if(splashT>0){
    splashT-=dt*0.9;
    splash.scale.setScalar(0.5+(1-splashT)*5.5);
    splash.material.opacity=Math.max(0,splashT*0.55);
    if(splashT<=0)splash.visible=false;
  }
  rodGroup.rotation.z=rodSwing-rodTension*0.12;

  if(sharkMesh.visible){
    sharkMesh.rotation.y=Math.atan2(camera.position.x-sharkMesh.position.x,camera.position.z-sharkMesh.position.z);
    sharkMesh.rotation.z=Math.sin(t*1.1)*0.06;
  }
  if(explorer.visible){
    const u=explorer.userData;
    const w=u.walk||0;
    u.legL.rotation.x=Math.sin(t*7)*0.7*w;
    u.legR.rotation.x=-Math.sin(t*7)*0.7*w;
    const grip=(u.hold||0)+rodTension*0.55+rodSwing*0.5;
    u.armL.rotation.x=-Math.sin(t*7)*0.55*w+grip;
    u.armR.rotation.x=Math.sin(t*7)*0.55*w+grip*1.1;
    explorer.rotation.x=-rodTension*0.16+rodSwing*0.12;
    u.body.position.y=Math.abs(Math.sin(t*7))*0.1*w;
  }

  for(let i=0;i<palms.length;i++){
    const g=palms[i];
    for(let j=1;j<g.children.length;j++){
      const lf=g.children[j];
      lf.rotation.z=-0.34+Math.sin(t*1.1+lf.userData.ph)*0.09;
    }
  }
  foam.material.opacity=0.34+Math.sin(t*1.3)*0.16;
  foam.position.z=58+Math.sin(t*0.9)*1.4;

  school.visible=under>0.08;
  if(school.visible){
    const right=new THREE.Vector3();
    camera.getWorldDirection(right);
    right.cross(camera.up).normalize();
    for(let i=0;i<fish.length;i++){
      const f=fish[i];
      const tgt=f.lead?f.lead.m.position:f.tg;
      const d=tgt.clone().sub(f.m.position);
      const dist=d.length();
      if(!f.lead&&dist<5)fishTarget(f);
      if(dist>0.001)d.normalize();
      f.vel.lerp(d.multiplyScalar(f.sp),Math.min(1,dt*f.turn));
      f.m.position.addScaledVector(f.vel,dt);
      f.m.position.y+=Math.sin(t*1.6+f.bob)*dt*0.9;
      if(f.m.position.y>-3)f.m.position.y=-3;
      f.m.rotation.y=Math.atan2(camera.position.x-f.m.position.x,camera.position.z-f.m.position.z);
      f.m.rotation.z=Math.sin(t*1.3+f.bob)*0.09;
      f.m.scale.x=f.vel.dot(right)<0?-1:1;
      f.mat.uniforms.uTime.value=t;
      f.mat.uniforms.uAmt.value=under;
    }
  }

  const f=Math.min(1,camLerp*dt*60);
  camPos.lerp(camPosT,f);
  camAim.lerp(camAimT,f);
  camera.position.copy(camPos);
  camera.position.y+=Math.sin(t*0.7)*0.18;
  camera.lookAt(camAim);

  renderer.render(scene,camera);
}

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

const wait=ms=>new Promise(r=>setTimeout(r,ms));
function tween(ms,fn){
  return new Promise(res=>{
    const s=performance.now();
    (function stepFn(){
      const k=Math.min(1,(performance.now()-s)/ms);
      const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      fn(e,k);
      if(k<1)requestAnimationFrame(stepFn);else res();
    })();
  });
}

const store={
  read(){try{return JSON.parse(localStorage.getItem("rofin_wl")||"{}")}catch(e){return{}}},
  write(v){try{localStorage.setItem("rofin_wl",JSON.stringify(v))}catch(e){}}
};
const data=Object.assign({username:"",comment:"",wallet:"",stage:0},store.read());
const panel=document.getElementById("panel");
const finalView=document.getElementById("final");

const steps=[
 {body(){return '<p class="step">TASK 1 OF 4</p><h2>ENTER YOUR X USERNAME</h2>'+
   '<input id="f_user" type="text" autocomplete="off" placeholder="X Username" value="'+data.username+'">'+
   '<p>Follow @'+CONFIG.handle+' on X</p>'+
   '<div class="row"><button class="btn ghost small" id="f_open">OPEN X PROFILE</button></div>'+
   '<div class="check" id="f_follow"><span class="box"></span><span>I have followed @'+CONFIG.handle+'</span></div>'+
   '<p class="err" id="f_err"></p>'+
   '<div class="row"><button class="btn" id="f_go" disabled>VERIFY</button></div>'+
   '<p class="note">Entries are checked on X before the whitelist is finalized.</p>'},
  wire(done){
    const user=document.getElementById("f_user"),go=document.getElementById("f_go"),err=document.getElementById("f_err");
    const follow=document.getElementById("f_follow");
    let opened=false,ticked=false;
    const valid=()=>/^@?[A-Za-z0-9_]{2,15}$/.test(user.value.trim());
    const sync=()=>{go.disabled=!(valid()&&opened&&ticked)};
    user.addEventListener("input",sync);
    document.getElementById("f_open").addEventListener("click",()=>{opened=true;window.open(CONFIG.profileUrl,"_blank","noopener");sync()});
    follow.addEventListener("click",()=>{
      if(!opened){err.textContent="Open the X profile first.";return}
      ticked=!ticked;err.textContent="";
      follow.querySelector(".box").classList.toggle("done",ticked);sync();});
    go.addEventListener("click",()=>{
      if(!valid()){err.textContent="Enter a valid X username.";return}
      data.username=user.value.trim().replace(/^@/,"");store.write(data);done();});
  }},
 {body(){return '<p class="step">TASK 2 OF 4</p><h2>PINNED POST</h2>'+
   '<p>Like and repost the pinned post of @'+CONFIG.handle+'.</p>'+
   '<div class="row"><button class="btn ghost small" id="p_open">OPEN PINNED POST</button></div>'+
   '<div class="check" id="p_like"><span class="box"></span><span>I liked the pinned post</span></div>'+
   '<div class="check" id="p_rt"><span class="box"></span><span>I reposted the pinned post</span></div>'+
   '<p class="err" id="p_err"></p>'+
   '<div class="row"><button class="btn" id="p_go" disabled>VERIFY</button></div>'+
   '<p class="note">Both actions are required and are checked on X.</p>'},
  wire(done){
    const go=document.getElementById("p_go"),err=document.getElementById("p_err");
    let opened=false;const st={like:false,rt:false};
    const sync=()=>{go.disabled=!(opened&&st.like&&st.rt)};
    document.getElementById("p_open").addEventListener("click",()=>{opened=true;window.open(CONFIG.pinnedPostUrl,"_blank","noopener");sync()});
    [["p_like","like"],["p_rt","rt"]].forEach(pair=>{
      const el=document.getElementById(pair[0]);
      el.addEventListener("click",()=>{
        if(!opened){err.textContent="Open the pinned post first.";return}
        st[pair[1]]=!st[pair[1]];err.textContent="";
        el.querySelector(".box").classList.toggle("done",st[pair[1]]);sync();});});
    go.addEventListener("click",()=>{if(!go.disabled)done()});
  }},
 {body(){return '<p class="step">TASK 3 OF 4</p><h2>COMMENT ON THE PINNED POST</h2>'+
   '<p>Tag 3 friends in your comment for a chance to receive ROFiN GTD. Winners are drawn by raffle, so tagging does not guarantee a spot.</p>'+
   '<div class="row"><button class="btn ghost small" id="c_open">OPEN PINNED POST</button></div>'+
   '<input id="c_link" type="url" autocomplete="off" placeholder="Paste your comment link" value="'+data.comment+'">'+
   '<p class="err" id="c_err"></p>'+
   '<div class="row"><button class="btn" id="c_go" disabled>VERIFY</button></div>'+
   '<p class="note">The link must point to your own comment on X.</p>'},
  wire(done){
    const link=document.getElementById("c_link"),go=document.getElementById("c_go"),err=document.getElementById("c_err");
    const ok=()=>/^https?:\/\/(www\.)?(x|twitter)\.com\/[A-Za-z0-9_]{1,15}\/status\/\d{5,}/.test(link.value.trim());
    link.addEventListener("input",()=>{go.disabled=link.value.trim().length<10});
    document.getElementById("c_open").addEventListener("click",()=>window.open(CONFIG.pinnedPostUrl,"_blank","noopener"));
    go.addEventListener("click",()=>{
      if(!ok()){err.textContent="Paste a full X comment link.";return}
      data.comment=link.value.trim();store.write(data);done();});
  }},
 {body(){return '<p class="step">TASK 4 OF 4</p><h2>SUBMIT YOUR WALLET</h2>'+
   '<input id="w_addr" type="text" autocomplete="off" spellcheck="false" placeholder="Robinhood wallet address" value="'+data.wallet+'">'+
   '<p class="err" id="w_err"></p>'+
   '<div class="row"><button class="btn" id="w_go" disabled>SUBMIT</button></div>'+
   '<p class="note">Never share a seed phrase or private key. Only a public address is needed.</p>'},
  wire(done){
    const addr=document.getElementById("w_addr"),go=document.getElementById("w_go"),err=document.getElementById("w_err");
    const ok=()=>/^0x[a-fA-F0-9]{40}$/.test(addr.value.trim());
    addr.addEventListener("input",()=>{go.disabled=addr.value.trim().length<10});
    go.addEventListener("click",async()=>{
      if(!ok()){err.textContent="Enter a valid wallet address starting with 0x.";return}
      data.wallet=addr.value.trim();store.write(data);
      go.disabled=true;go.textContent="SENDING";
      const sent=await submit();
      if(!sent){go.disabled=false;go.textContent="SUBMIT";err.textContent="Submission failed. Please try again.";return}
      done();});
  }}
];

async function submit(){
  let url="";
  try{url=atob(CONFIG.endpoint)}catch(e){url=""}
  if(!/^https:\/\//.test(url))return false;
  try{
    await fetch(url,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({username:data.username,comment:data.comment,wallet:data.wallet})});
    return true;
  }catch(e){return false}
}

function showPanel(i){
  panel.innerHTML='<div class="card">'+steps[i].body()+'</div>';
  panel.classList.add("on");
  steps[i].wire(()=>advance(i));
}
function hidePanel(){panel.classList.remove("on")}

function ready(){
  setShark(0);
  spawnSchool();
  document.getElementById("loader").classList.add("off");
  animate();
}

async function board(){
  explorer.visible=true;
  const p0=new THREE.Vector3(-17,0,92);
  const p1=new THREE.Vector3(-1.4,0,61.5);
  explorer.position.set(p0.x,sandHeight(p0.z,p0.x),p0.z);
  explorer.rotation.y=Math.PI*0.94;
  explorer.userData.walk=1;
  look(34*mScale,12,88,-8,4,72,0.03);
  await tween(3000,k=>{
    const x=p0.x+(p1.x-p0.x)*k,z=p0.z+(p1.z-p0.z)*k;
    explorer.position.set(x,Math.max(0.1,sandHeight(z,x)),z);
  });
  look(26*mScale,11,74,0,5,56,0.03);
  const deckY=5.0;
  await tween(1800,k=>{
    const z=61.5-k*10.1;
    explorer.position.set(-1.4+k*2.0,Math.max(0.1,sandHeight(z,0))+k*deckY,z);
    explorer.rotation.y=Math.PI*0.94+k*0.12;
  });
  deck.add(explorer);
  explorer.position.set(-9.4,4.8,0.6);
  explorer.rotation.y=Math.PI*0.5;
  explorer.userData.walk=1;
  look(30*mScale,13,shipZ+34,2,7,shipZ+4,0.03);
  await tween(2600,k=>{
    explorer.position.x=-9.4+k*18.2;
    explorer.position.z=0.6+k*1.8;
  });
  explorer.userData.walk=0;
  explorer.userData.hold=0.9;
  explorer.rotation.y=Math.PI*0.62;
}

async function voyage(){
  plank.visible=false;
  anchorRope.visible=false;
  await tween(2600,k=>{
    shipSpeed=k*7;
    look(30*mScale,13,shipZ+40,0,8,shipZ-6,0.03);
  });
  await tween(4200,k=>{
    shipSpeed=7+k*9;
    look(22*mScale+Math.sin(k*3.1)*10*mScale,10+k*5,shipZ+34+k*12,2,8,shipZ-14,0.03);
  });
  await tween(2400,k=>{
    shipSpeed=16*(1-k);
    look(24*mScale,12,shipZ+30,2,7,shipZ-8,0.03);
  });
  shipSpeed=0;
}

async function dive(){
  await tween(1800,k=>{
    look(hookPos.x+15*camNear,10-k*6,hookPos.z+17*camNear,hookPos.x+1,4-k*4,hookPos.z,0.03);
  });
  underT=1;
  await tween(3000,k=>{
    lineTarget=12+k*6.6;
    look(hookPos.x+13*camNear,4-k*15,hookPos.z+15*camNear,
      hookPos.x+1,2-k*14,hookPos.z,0.045);
  });
}

async function castRod(){
  look(ship.position.x+21*mScale,13,shipZ-6+17*mScale,ship.position.x+3,7,shipZ-14,0.028);
  await tween(1100,()=>{});
  await tween(750,k=>{rodSwing=0.55*k});
  await tween(430,k=>{rodSwing=0.55-k*0.88});
  await tween(1100,k=>{
    hookOut=k*11;
    lineTarget=2.4+k*9.6;
    rodSwing=-0.33+k*0.36;
  });
  await tween(600,()=>{});
}

async function approach(i){
  setShark(i);
  sharkUniforms.uFade.value=0;
  const from=new THREE.Vector3(hookPos.x+38,hookPos.y-24,hookPos.z-34);
  const to=new THREE.Vector3(hookPos.x+7.2,hookPos.y-2.2,hookPos.z-1.6);
  sharkMesh.position.copy(from);
  sharkMesh.visible=true;
  await tween(3000,k=>{
    sharkUniforms.uFade.value=Math.min(1,k*3);
    sharkMesh.position.lerpVectors(from,to,k);
    sharkMesh.position.y+=Math.sin(k*8.5)*1.4;
    look(hookPos.x+13*camNear,hookPos.y+3.4,hookPos.z+15*camNear,
      hookPos.x+2.6,hookPos.y-2.6,hookPos.z,0.028);
  });
  await tween(900,k=>{
    rodTension=k*0.85;
    lineTarget=18.6-k*1.8;
    sharkMesh.position.y=to.y-k*0.8;
  });
  showPanel(i);
}

async function advance(i){
  hidePanel();
  data.stage=i+1;store.write(data);
  if(i===steps.length-1){await landed();return}
  await tween(1100,k=>{
    rodTension=0.85-k*0.62;
    lineTarget=16.8-k*6.4;
    sharkMesh.position.y=hookPos.y-2.2+k*3.4;
  });
  await tween(1100,k=>{
    sharkMesh.position.x+=0.09;
    sharkMesh.position.z-=0.16;
    sharkMesh.position.y-=0.05;
    sharkUniforms.uFade.value=1-k;
  });
  sharkMesh.visible=false;
  rodTension=0;
  await tween(900,k=>{lineTarget=10.4+k*8.2});
  approach(i+1);
}

async function landed(){
  await tween(2100,k=>{
    rodTension=0.9-k*0.52;
    lineTarget=16.8-k*14.4;
    sharkMesh.position.set(hookPos.x+4.4,hookPos.y-2.4,hookPos.z-0.6);
    look(hookPos.x+12*camNear,hookPos.y+2+k*16,hookPos.z+14*camNear,
      hookPos.x+2,hookPos.y+1,hookPos.z,0.045);
  });
  underT=0;
  setShark(4);
  sharkUniforms.uFade.value=1;
  await tween(2000,k=>{
    sharkMesh.position.set(hookPos.x+4.4,hookPos.y-1.6+k*4.2,hookPos.z-0.6);
    look(hookPos.x+11*camNear,8+k*5,hookPos.z+13*camNear,hookPos.x+2,5+k*3,hookPos.z,0.045);
  });
  finalView.innerHTML='<div class="card"><img src="'+SHARKS[4]+'" alt="Happy ROFiN shark">'+
    '<h2>CONGRATULATIONS</h2>'+
    '<p>You caught a ROFiN and joined the Whitelist.</p>'+
    '<p>Stay tuned for our next update on X.</p>'+
    '<div class="row"><button class="btn" id="fin_x">FOLLOW @'+CONFIG.handle+'</button></div>'+
    '<p class="note">Whitelist entries are reviewed on X. A ROFiN GTD spot is not guaranteed.</p></div>';
  finalView.classList.add("on");
  document.getElementById("fin_x").addEventListener("click",()=>window.open(CONFIG.profileUrl,"_blank","noopener"));
}

async function begin(){
  const sw=document.getElementById("startwrap");
  sw.style.opacity="0";sw.style.pointerEvents="none";
  await board();
  await voyage();
  await castRod();
  await dive();
  approach(Math.min(data.stage,steps.length-1));
}
document.getElementById("start").addEventListener("click",begin,{once:true});
</script>
